<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="parent-container">
        <div class="main-container"> 
        </div>
        <div class="side-container">
            <div class="transaction-container"> 
                <form class="transaction-form">
                    <input type="text" id="sender" placeholder="Sender">
                    <input type="text" id="receiver" placeholder="Receiver">
                    <input type="number" id="amount" placeholder="Amount">
                    <button id="send-transaction" class="send">New</button>
                </form>
            </div>
            <div class="wallet-container"> 
                <form class="wallet-form">
                    <input type="text" id="name" placeholder="Wallet name">
                    <label id="balance"></label>
                    <button id="send-wallet" class="send">New</button>
                    <button id="get-wallet" class="send">Balance</button>
                </form>
            </div>
        </div>
    </div>
<script type="module" src="script.js"></script>
</body>
</html>
